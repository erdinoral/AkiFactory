<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>AkiFactory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0c;
      color: #e8e8ec;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px;
      text-align: center;
    }
    .logo {
      width: 96px; height: 96px;
      border-radius: 20px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
      animation: pulse 2.2s ease-in-out infinite;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #6b6b78; font-size: 12px; margin-bottom: 22px; }
    .status { font-size: 13px; min-height: 20px; margin-bottom: 12px; }
    .bar {
      width: 100%;
      max-width: 360px;
      height: 8px;
      background: #1a1a22;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #7c3aed);
      transition: width 0.25s ease;
    }
    .hint { color: #6b6b78; font-size: 11px; line-height: 1.5; max-width: 340px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="../assets/akifactory-256.png" alt="AkiFactory" width="96" height="96" /></div>
    <h1>AkiFactory</h1>
    <p class="sub">Kısa Video Üretim Atölyesi</p>
    <p class="status" id="status">Başlatılıyor…</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="hint">İlk açılışta motor yüklenmesi 1–3 dakika sürebilir. Bu pencere hazır olunca kapanır.</p>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const fillEl = document.getElementById("fill");
    if (window.akifactorySplash?.onProgress) {
      window.akifactorySplash.onProgress((data) => {
        if (data?.message) statusEl.textContent = data.message;
        if (typeof data?.pct === "number") fillEl.style.width = `${data.pct}%`;
      });
    }
  </script>
</body>
</html>
