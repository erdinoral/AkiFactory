<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AkiFactory</title>
  <link rel="stylesheet" href="/assets/splash.css" />
</head>
<body>
  <div class="splash-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="scanline"></div>
  </div>
  <main class="splash-card">
    <div class="logo-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="logo-glow"></div>
      <img src="/assets/logo.png" alt="" class="logo-img" width="96" height="96" />
    </div>
    <h1 class="splash-title">Aki<span class="accent">Factory</span></h1>
    <p class="splash-tag">Short Video Studio</p>
    <p id="splash-status" class="splash-status">Starting…</p>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="splash-bar" class="progress-fill"></div>
    </div>
    <footer class="splash-legal">
      <p>An Akiyom brand.</p>
      <p>All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
